  (function () {
    var CURRENT_BUILD = "2026-08-25-v7-unique-since-night";
    var checking = false;
    function checkForUpdate() {
      if (checking) return;
      checking = true;
      fetch("version.json", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.build && data.build !== CURRENT_BUILD) {
            window.location.reload();
          }
        })
        .catch(function () {})
        .finally(function () { checking = false; });
    }
    setInterval(checkForUpdate, 30 * 60 * 1000);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) checkForUpdate();
    });
    setTimeout(checkForUpdate, 4000);
  })();
</script>

<script>
"use strict";
const h = React.createElement;
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ---------- Icons (identische Lucide-Icons wie die Haupt-App) ----------

const ICON_PATHS = {

  ],
  heart: [["path", { d: "M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" }]],
  "chevron-down": [["path", { d: "m6 9 6 6 6-6" }]],
  "chevron-up": [["path", { d: "m18 15-6-6-6 6" }]],
  "cloud-upload": [
    ["path", { d: "M12 13v8" }],
    ["path", { d: "M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" }],
    ["path", { d: "m8 17 4-4 4 4" }],
  ],
  "arrow-right-circle": [

    ["path", { d: "M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" }],
    ["path", { d: "M8 16H3v5" }],
  ],
  armchair: [
    ["path", { d: "M19 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v3" }],
    ["path", { d: "M3 16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z" }],
    ["path", { d: "M5 18v2" }], ["path", { d: "M19 18v2" }],
  ],
  x: [["path", { d: "M18 6 6 18" }], ["path", { d: "m6 6 12 12" }]],
};
function Icon({ name, size = 15, style, className, fill }) {
  const parts = ICON_PATHS[name];
  if (!parts) return null;
  return h("svg", {
    width: size, height: size, viewBox: "0 0 24 24", fill: fill || "none",
    stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round",
    style: { display: "inline-block", verticalAlign: "middle", flexShrink: 0, ...style }, className
  }, parts.map(([tag, attrs], i) => h(tag, { key: i, ...attrs })));
}

// ---------- Helfer ----------

function hashColor(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const hues = [330, 20, 285, 45, 200];
  const hue = hues[Math.abs(hash) % hues.length];
  return `hsl(${hue}, 60%, 38%)`;
}
function initials(name) {
  return (name || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
}

// ---------- Solver (unverändert aus der Haupt-App übernommen) ----------

function solve(state) {
  const A = state.groupA, B = state.groupB;
  const nA = A.length, nB = B.length;
  if (nA === 0 || nB === 0) return { error: "Beide Gruppen brauchen mindestens 1 Person." };
  if (Math.max(nA, nB) > 12) return { error: `${Math.max(nA, nB)} Personen in einer Gruppe sind zu viele für eine vollständige Berechnung im Browser (Limit: 12).` };
  const doubleIds = new Set(state.doubleMatchIds || []);
  const degA = A.map(p => doubleIds.has(p.id) ? 2 : 1);
  const degB = B.map(p => doubleIds.has(p.id) ? 2 : 1);
  const totalA = degA.reduce((s, d) => s + d, 0);
  const totalB = degB.reduce((s, d) => s + d, 0);
  const netExcess = totalA - totalB;
  if (Math.abs(netExcess) > 3) {
    return { error: `${state.groupAName} (${totalA} Matches insgesamt) und ${state.groupBName} (${totalB}) sind zu unausgeglichen.` };
  }
  const excessIsA = netExcess > 0;
  const excessDoubleCount = netExcess === 0 ? 0 : (excessIsA ? A : B).filter(p => doubleIds.has(p.id)).length;
  if (netExcess !== 0 && excessDoubleCount > 0) {
    return { error: `Doppel-Match-Twist auf der Seite mit Überschuss wird nicht unterstützt, solange dort noch ein Überschuss bleibt.` };
  }
  const iterIsA = netExcess < 0;
  const iterGroup = iterIsA ? A : B;
  const poolGroup = iterIsA ? B : A;
  const iterDeg = iterIsA ? degA : degB;
  const poolCap = iterIsA ? degB : degA;
  const nIter = iterGroup.length, nPool = poolGroup.length;
  const iterIds = iterGroup.map(p => p.id);
  const poolIds = poolGroup.map(p => p.id);
  const poolIndex = {};
  poolIds.forEach((id, i) => poolIndex[id] = i);
  const forcedSets = Array.from({ length: nIter }, () => new Set());
  const forbidden = Array.from({ length: nIter }, () => new Set());
  state.matchbox.forEach(tb => {
    const iterId = iterIsA ? tb.aId : tb.bId;
    const poolId = iterIsA ? tb.bId : tb.aId;
    const ii = iterIds.indexOf(iterId);
    const pi = poolIndex[poolId];
    if (ii === -1 || pi === undefined) return;
    if (tb.isMatch) forcedSets[ii].add(pi); else forbidden[ii].add(pi);
  });
  for (let ii = 0; ii < nIter; ii++) {
    if (forcedSets[ii].size > iterDeg[ii]) {
      return { error: `Widerspruch bei ${iterGroup[ii].name}: mehr bestätigte Matchbox-Treffer als aktuell erlaubt.` };
    }
  }
  const nightConstraints = state.nights.map(night => {
    const perIter = Array.from({ length: nIter }, () => []);
    const addPair = (idX, idY) => {
      let ii = iterIds.indexOf(idX), pi = poolIndex[idY];
      if (ii === -1 || pi === undefined) { ii = iterIds.indexOf(idY); pi = poolIndex[idX]; }
      if (ii !== -1 && pi !== undefined) perIter[ii].push(pi);
    };
    Object.entries(night.pairs).forEach(([id1, id2]) => addPair(id1, id2));
    if (night.extraPartner && night.extraPartner.smallId && night.extraPartner.bigId) {
      addPair(night.extraPartner.smallId, night.extraPartner.bigId);
    }
    return { perIter, lights: night.lights };
  });
  const nNights = nightConstraints.length;
  const nightCorrectSoFar = new Array(nNights).fill(0);
  const usedPool = new Array(nPool).fill(0);
  const assignment = Array.from({ length: nIter }, () => []);
  const counts = Array.from({ length: nIter }, () => new Array(nPool).fill(0));
  let solutionCount = 0;
  let visited = 0;
  const VISIT_CAP = 40000000;

  function applyNightDelta(ii) {
    const remaining = nIter - ii - 1;
    const touched = [];
    for (let n = 0; n < nNights; n++) {
      const night = nightConstraints[n];
      if (assignment[ii].some(pi => night.perIter[ii].includes(pi))) {
        nightCorrectSoFar[n]++;
        touched.push(n);
      }
      if (nightCorrectSoFar[n] > night.lights || nightCorrectSoFar[n] + remaining < night.lights) {
        for (const t of touched) nightCorrectSoFar[t]--;
        return null;
      }
    }
    return touched;
  }
  function undoNightDelta(touched) { for (const n of touched) nightCorrectSoFar[n]--; }
  function backtrack(ii) {
    if (visited > VISIT_CAP) return;
    if (ii === nIter) {
      visited++; solutionCount++;
      for (let k = 0; k < nIter; k++) for (const pi of assignment[k]) counts[k][pi]++;
      return;
    }
    const need = iterDeg[ii];
    const required = forcedSets[ii];
    if (need === 1) {
      if (required.size === 1) {
        const j = [...required][0];
        if (usedPool[j] < poolCap[j] && !forbidden[ii].has(j)) {
          usedPool[j]++; assignment[ii] = [j];
          const touched = applyNightDelta(ii);
          if (touched) { backtrack(ii + 1); undoNightDelta(touched); }
          usedPool[j]--; assignment[ii] = [];
        }
        return;
      }
      for (let j = 0; j < nPool; j++) {
        if (usedPool[j] >= poolCap[j] || forbidden[ii].has(j)) continue;
        usedPool[j]++; assignment[ii] = [j];
        const touched = applyNightDelta(ii);
        if (touched) { backtrack(ii + 1); undoNightDelta(touched); }
        usedPool[j]--; assignment[ii] = [];
      }
    } else {
      for (let j1 = 0; j1 < nPool; j1++) {
        if (usedPool[j1] >= poolCap[j1] || forbidden[ii].has(j1)) continue;
        usedPool[j1]++;
        for (let j2 = j1 + 1; j2 < nPool; j2++) {
          if (usedPool[j2] >= poolCap[j2] || forbidden[ii].has(j2)) continue;
          let ok = true;
          for (const r of required) if (r !== j1 && r !== j2) { ok = false; break; }
          if (!ok) continue;
          usedPool[j2]++; assignment[ii] = [j1, j2];
          const touched = applyNightDelta(ii);
          if (touched) { backtrack(ii + 1); undoNightDelta(touched); }
          usedPool[j2]--; assignment[ii] = [];
        }
        usedPool[j1]--;
      }
    }
  }
  backtrack(0);
  if (visited > VISIT_CAP) return { error: "Zu viele mögliche Kombinationen für eine vollständige Berechnung." };
  if (solutionCount === 0) return { error: "Keine Kombination erfüllt alle eingetragenen Nächte und Matchbox-Ergebnisse gleichzeitig." };
  const matrix = Array.from({ length: A.length }, () => new Array(B.length).fill(0));
  for (let ii = 0; ii < nIter; ii++) {
    for (let pi = 0; pi < nPool; pi++) {
      const c = counts[ii][pi];
      if (c === 0) continue;
      const iterPersonId = iterIds[ii];
      const poolPersonId = poolIds[pi];
      const aIdx = A.findIndex(p => p.id === (iterIsA ? iterPersonId : poolPersonId));
      const bIdx = B.findIndex(p => p.id === (iterIsA ? poolPersonId : iterPersonId));
      matrix[aIdx][bIdx] = c / solutionCount;
    }
  }
  return { matrix, solutionCount, doubleMatchActive: doubleIds.size > 0 };
}

// ---------- UI-Bausteine ----------

function Avatar({ name, photo, size = 44, ring }) {
  return h("div", {
    style: {
      width: size, height: size, borderRadius: "50%", overflow: "hidden",
      display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontWeight: 600,
      background: photo ? "transparent" : hashColor(name || "?"),
      boxShadow: ring ? `0 0 0 2px ${ring}` : "none",
      fontSize: size * 0.36, color: "#FFFFFF",
    }
  }, photo
    ? h("img", { src: photo, alt: name, style: { width: "100%", height: "100%", objectFit: "cover" }, onError: e => { e.target.style.display = "none"; } })
    : initials(name));
}

function SectionLabel({ children, icon, right }) {
  return h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
      icon && h(Icon, { name: icon, size: 15, style: { color: "#14ABE0" } }),
      h("h2", { style: { letterSpacing: "0.18em", fontSize: 11, textTransform: "uppercase", color: "#726B85", margin: 0, fontWeight: 400 } }, children)
    ),
    right || null
  );
}

const EMPTY_STATE = {
  groupAName: "Männer", groupBName: "Frauen", seasonInfo: null,
  bench: [], groupA: [], groupB: [], nights: [], matchbox: [], doubleMatchIds: []
};

function buildStateFromCast(castData) {
  const groupA = [], groupB = [], bench = [];
  (castData.kandidaten || []).forEach(k => {
    const person = { id: k.id || (k.name + Math.random().toString(36).slice(2, 6)), name: k.name, photo: k.foto || k.photo || "", notiz: k.notiz || "", zitat: k.zitat || "", instagram: k.instagram || "" };
    const g = (k.gruppe || "").trim().toUpperCase();
    if (g === "A") groupA.push(person);
    else if (g === "B") groupB.push(person);
    else bench.push(person);
  });
  return { ...EMPTY_STATE, seasonInfo: { staffel: castData.staffel }, groupA, groupB, bench };
}

function App() {
  const [availableCasts, setAvailableCasts] = useState([]);
  const [selectedCast, setSelectedCast] = useState(null);
  const [state, setState] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState("");
  const [result, setResult] = useState(null);
  const [computing, setComputing] = useState(false);
  const [expandedNight, setExpandedNight] = useState(null);
  const [expandedCard, setExpandedCard] = useState(null);
  const [logoError, setLogoError] = useState(false);
  const [lastUpdated, setLastUpdated] = useState(null);
  const lastRawRef = useRef(null);

  const loadSeason = useCallback(async (filename, { silent } = {}) => {
    if (!silent) setLoadError("");
    try {
      const r = await fetch(new URL("stand/" + filename, window.location.href).toString(), { cache: "no-store" });
      if (!r.ok) throw new Error("kein Stand");
      const raw = await r.text();
      if (raw === lastRawRef.current) { setLastUpdated(new Date()); return; }
      lastRawRef.current = raw;
      const parsed = JSON.parse(raw);
      setState({ ...EMPTY_STATE, ...parsed });
      setLastUpdated(new Date());
      setLoaded(true);
    } catch (e) {
      try {
        const r2 = await fetch(new URL("cast/" + filename, window.location.href).toString(), { cache: "no-store" });
        if (!r2.ok) throw new Error("HTTP " + r2.status);
        const castData = await r2.json();
        setState(buildStateFromCast(castData));
        setLastUpdated(new Date());
        setLoaded(true);
      } catch (e2) {
        if (!silent) setLoadError(`Konnte Staffel „${filename}" nicht laden: ${e2.message}`);
        setLoaded(true);
      }
    }
  }, []);

  // Initial: Staffel-Liste + Staffel aus ?staffel= oder die neueste
  useEffect(() => {
    (async () => {
      let casts = [];
      try {
        const r = await fetch(new URL("cast/index.json", window.location.href).toString(), { cache: "no-store" });
        if (r.ok) casts = await r.json();
      } catch (e) { /* ignore */ }
      setAvailableCasts(casts);
      const params = new URLSearchParams(window.location.search);
      const staffelParam = params.get("staffel");
      const initial = (staffelParam && casts.includes(staffelParam)) ? staffelParam : casts[0];
      if (initial) {
        setSelectedCast(initial);
        loadSeason(initial);
      } else {
        setLoadError("Keine Staffel-Daten gefunden (cast/index.json leer oder fehlt).");
        setLoaded(true);
      }
    })();
  }, [loadSeason]);

  // Regelmäßig im Hintergrund aktualisieren (die Seite selbst ist statisch,
  // aber die JSON-Dateien im Repo werden vom Pi automatisch aktuell gehalten)
  useEffect(() => {
    if (!selectedCast) return;
    const t = setInterval(() => loadSeason(selectedCast, { silent: true }), 25000);
    return () => clearInterval(t);
  }, [selectedCast, loadSeason]);

  const switchSeason = filename => {
    setSelectedCast(filename);
    lastRawRef.current = null;
    const params = new URLSearchParams(window.location.search);
    params.set("staffel", filename);
    window.history.replaceState({}, "", "?" + params.toString());
    loadSeason(filename);
  };

  // Vorausberechnung, sobald sich der Stand ändert
  useEffect(() => {
    if (!state) return;
    // Bei einer großen, aber noch komplett leeren Staffel (keine Nächte, keine
    // Matchbox-Ergebnisse) wäre die Berechnung unnötig aufwändig, ohne dass es
    // dafür ein sinnvolles Ergebnis gäbe (jede Kombination wäre gleich wahrscheinlich) -
    // in dem Fall gar nicht erst rechnen.
    const nA_ = state.groupA.length, nB_ = state.groupB.length;
    const unconstrainedAndLarge = state.nights.length === 0 && state.matchbox.length === 0 && Math.max(nA_, nB_) > 8;
    if (unconstrainedAndLarge) {
      setResult(null);
      return;
    }
    setComputing(true);
    const t = setTimeout(() => {
      setResult(solve(state));
      setComputing(false);
    }, 30);
    return () => clearTimeout(t);
  }, [state]);

  // Sobald die aktuelle Lösung eindeutig ist (solutionCount === 1), rechnet dieser
  // Effekt rückwirkend durch, ab welcher Nacht (kumulativ, mit allen Matchbox-
  // Ergebnissen) die Lösung schon eindeutig bestimmbar gewesen wäre. Läuft
  // asynchron/deferred, damit mehrere Solve-Durchläufe hintereinander nicht die
  // Bedienung blockieren.
  const [uniqueSinceNight, setUniqueSinceNight] = useState(null);
  const [uniqueSinceComputing, setUniqueSinceComputing] = useState(false);
  useEffect(() => {
    if (!state || !result || result.solutionCount !== 1) {
      setUniqueSinceNight(null);
      return;
    }
    setUniqueSinceComputing(true);
    const timer = setTimeout(() => {
      const orderedNights = [...state.nights].sort((a, b) => (a.remoteNummer ?? 0) - (b.remoteNummer ?? 0));
      let foundLabel = null;
      for (let i = 0; i < orderedNights.length; i++) {
        const partialState = { ...state, nights: orderedNights.slice(0, i + 1) };
        const r = solve(partialState);
        if (r && !r.error && r.solutionCount === 1) {
          foundLabel = orderedNights[i].label || `Nacht ${i + 1}`;
          break;
        }
      }
      setUniqueSinceNight(foundLabel);
      setUniqueSinceComputing(false);
    }, 50);
    return () => clearTimeout(timer);
  }, [result]);

  const nA = state ? state.groupA.length : 0;
  const nB = state ? state.groupB.length : 0;
  const ready = nA > 0 && nB > 0;
  const maxProb = useMemo(() => {
    if (!result || result.error) return 0;
    let m = 0;
    result.matrix.forEach(row => row.forEach(v => { if (v > m) m = v; }));
    return m;
  }, [result]);
  const staffelStand = useMemo(() => {
    if (!state || !state.nights.length) return null;
    const lastNight = state.nights[state.nights.length - 1];
    return `Letzter Eintrag: ${lastNight.label}`;
  }, [state]);
  const pushedAtLabel = useMemo(() => {
    if (!state || !state._pushedAt) return null;
    const d = new Date(state._pushedAt);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + " Uhr";
  }, [state]);
  const nameOf = id => state ? ([...state.groupA, ...state.groupB].find(p => p.id === id)?.name || "?") : "?";
  const factsFor = personId => {
    const confirmed = state.matchbox.filter(tb => tb.isMatch && (tb.aId === personId || tb.bId === personId));
    const excluded = state.matchbox.filter(tb => !tb.isMatch && (tb.aId === personId || tb.bId === personId));
    return { confirmed, excluded };
  };
  const perfectMatches = useMemo(() => {
    if (!state) return [];
    const all = [...state.groupA, ...state.groupB];
    const byId = id => all.find(p => p.id === id);
    const list = [];
    const seen = new Set();
    state.matchbox.filter(tb => tb.isMatch).forEach(tb => {
      const a = byId(tb.aId), b = byId(tb.bId);
      if (!a || !b) return;
      const key = a.id + "|" + b.id;
      if (seen.has(key)) return;
      seen.add(key);
      list.push({ aName: a.name, aPhoto: a.photo, bName: b.name, bPhoto: b.photo, source: "matchbox" });
    });
    // result kann fuer einen kurzen Moment noch zur VORHERIGEN Staffel gehoeren
    // (die Neuberechnung ist leicht verzoegert/debounced) - ohne diesen Dimensions-
    // Check fuehrt ein Staffel-Wechsel mit anderer Cast-Groesse zu einem Absturz
    // (result.matrix[i][j] existiert dann nicht mehr fuer die neuen Indizes).
    const matrixMatchesCurrentState = result && result.matrix
      && result.matrix.length === state.groupA.length
      && (result.matrix.length === 0 || (result.matrix[0] || []).length === state.groupB.length);
    if (result && !result.error && matrixMatchesCurrentState) {
      const LIKELY_THRESHOLD = 0.7;
      const certain = [], likely = [];
      state.groupA.forEach((a, i) => {
        state.groupB.forEach((b, j) => {
          const p = result.matrix[i][j];
          const key = a.id + "|" + b.id;
          if (p === 1) {
            if (seen.has(key)) return;
            seen.add(key);
            certain.push({ aName: a.name, aPhoto: a.photo, bName: b.name, bPhoto: b.photo, source: "berechnet" });
          } else if (p >= LIKELY_THRESHOLD) {
            if (seen.has(key)) return;
            seen.add(key);
            likely.push({ aName: a.name, aPhoto: a.photo, bName: b.name, bPhoto: b.photo, source: "wahrscheinlich", pct: Math.round(p * 100) });
          }
        });
      });
      likely.sort((x, y) => y.pct - x.pct);
      list.push(...certain, ...likely);
    }
    return list;
  }, [state, result]);

  if (!loaded) {
    return h("div", { style: { minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16, fontFamily: "Inter, sans-serif" } },
      h("div", { className: "boot-spin", style: { width: 40, height: 40, borderRadius: "50%", border: "4px solid #E7E1F0", borderTopColor: "#E0227A" } }),
      h("p", { className: "text-sm", style: { color: "#726B85" } }, "Lädt …")
    );
  }

  if (loadError && !state) {
    return h("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Inter, sans-serif", padding: 24, textAlign: "center" } },
      h("p", { style: { color: "#C81E3A", maxWidth: 420 } }, loadError)
    );
  }

  const label = k => k === "A" ? state.groupAName : state.groupBName;

  return h("div", { style: { background: "#FFFFFF", minHeight: "100vh", fontFamily: "Inter, sans-serif", color: "#241D33" } },
    // Header
    h("header", { style: { borderBottom: "1px solid #ECE6F5", background: "radial-gradient(ellipse at top left, rgba(20,171,224,0.10), transparent 55%), radial-gradient(ellipse at top right, rgba(224,34,122,0.09), transparent 55%)" } },
      h("div", { style: { maxWidth: 1100, margin: "0 auto", padding: "40px 20px 30px" } },
        h("div", { className: "flex items-center gap-2 mb-2", style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 8 } },
          h(Icon, { name: "lightbulb", size: 16, className: "glow-pulse", style: { color: "#F2B705" } }),
          h("span", { style: { fontSize: 11, textTransform: "uppercase", letterSpacing: "0.3em", color: "#726B85" } }, "Matching-Night Vorausberechnung")
        ),
        h("div", { style: { marginBottom: 12, transform: "rotate(-1.5deg)", transformOrigin: "left center" } },
          !logoError
            ? h("img", { src: "logo.png", alt: "Are You The One?", onError: () => setLogoError(true), style: { height: 64, display: "block" } })
            : h("div", { style: { display: "inline-block" } },
                h("div", { className: "display-font", style: { textTransform: "uppercase", background: "#14ABE0", color: "#fff", padding: "6px 20px", fontSize: 26, letterSpacing: "0.02em" } }, "Are You"),
                h("div", { className: "display-font", style: { textTransform: "uppercase", background: "#E0227A", color: "#fff", padding: "6px 20px", fontSize: 26, letterSpacing: "0.02em", marginTop: -4, marginLeft: 14 } }, "The One?")
              )
        ),
        h("p", { style: { marginTop: 4, fontSize: 14, color: "#584F6E" } },
          (state.seasonInfo && state.seasonInfo.staffel) || "Perfect-Match-Rechner", " ",
          (nA || nB) ? `· ${nA + nB} aktiv${state.bench.length ? ` + ${state.bench.length} Ersatzbank` : ""}` : ""
        ),
        staffelStand && h("p", { style: { marginTop: 2, fontSize: 12, color: "#726B85" } }, staffelStand),
        h("div", { style: { display: "flex", flexWrap: "wrap", alignItems: "center", gap: 10, marginTop: 18 } },
          availableCasts.length > 1 && h("select", {
            value: selectedCast || "",
            onChange: e => switchSeason(e.target.value),
            style: { fontSize: 12, padding: "8px 14px", borderRadius: 999, fontWeight: 500, background: "#14ABE0", color: "#fff", border: "none" }
          }, availableCasts.map(f => h("option", { key: f, value: f },
            f.replace(/\.json$/i, "").replace(/[-_]/g, " ").replace(/\b\w/g, c => c.toUpperCase())
          ))),
          h("button", {
            onClick: () => loadSeason(selectedCast),
            style: { fontSize: 12, padding: "8px 14px", borderRadius: 999, border: "1px solid #DAD2EC", color: "#584F6E", background: "transparent", cursor: "pointer" }
          }, h(Icon, { name: "refresh-cw", size: 12 }), " Jetzt aktualisieren")
        ),
        h("p", { style: { fontSize: 11, marginTop: 10, color: "#948C9E" } },
          pushedAtLabel ? `Letzter Datensatz vom ${pushedAtLabel} · ` : "",
          "Browser hat zuletzt geprüft um ", lastUpdated ? lastUpdated.toLocaleTimeString("de-DE") : "–",
          " (alle 25s)"
        )
      )
    ),

    // Perfect Matches Banner
    perfectMatches.length > 0 && h("div", { style: { maxWidth: 1100, margin: "0 auto", padding: "24px 20px 0" } },
      h("p", { style: { textTransform: "uppercase", letterSpacing: "0.18em", fontSize: 11, marginBottom: 8, display: "flex", alignItems: "center", gap: 8, color: "#E0227A" } }, "♥ Perfect Matches"),
      h("div", { style: { display: "flex", flexWrap: "wrap", gap: 8 } },
        perfectMatches.map((m, i) => {
          const isLikely = m.source === "wahrscheinlich";
          return h("div", {
            key: i,
            style: {
              display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", borderRadius: 999, fontSize: 14,
              background: isLikely ? "transparent" : "#FCE7F1",
              border: isLikely ? "1px dashed #F0A8C6" : "none", color: "#241D33"
            }
          },
            h(Avatar, { name: m.aName, photo: m.aPhoto, size: 22 }),
            h("span", { style: { fontWeight: 500 } }, m.aName),
            h(Icon, { name: "heart", size: 12, fill: "#E0227A", style: { color: "#E0227A" } }),
            h("span", { style: { fontWeight: 500 } }, m.bName),
            h(Avatar, { name: m.bName, photo: m.bPhoto, size: 22 }),
            m.source === "berechnet" && h("span", { style: { fontSize: 10, marginLeft: 4, color: "#948C9E" } }, "berechnet"),
            isLikely && h("span", { style: { fontSize: 10, marginLeft: 4, color: "#B0679A" } }, m.pct, "% wahrscheinlich")
          );
        })
      )
    ),

    h("main", { style: { maxWidth: 1100, margin: "0 auto", padding: "32px 20px", display: "flex", flexDirection: "column", gap: 40 } },

      // Cast
      h("section", null,
        h(SectionLabel, { icon: "users" }, "Cast"),
        h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16 } },
          ["A", "B"].map(g => {
            const key = g === "A" ? "groupA" : "groupB";
            return h("div", { key: g, style: { borderRadius: 16, padding: 16, background: "#F7F5FC", border: "1px solid #E7E1F0" } },
              h("div", { style: { fontSize: 14, fontWeight: 600, marginBottom: 12, color: "#E0227A" } }, label(g)),
              h("div", { style: { display: "flex", flexDirection: "column", gap: 4, marginBottom: 8 } },
                state[key].map(p => {
                  const { confirmed, excluded } = factsFor(p.id);
                  const isOpen = expandedCard === p.id;
                  return h("div", { key: p.id },
                    h("button", {
                      onClick: () => setExpandedCard(isOpen ? null : p.id),
                      style: { display: "flex", alignItems: "flex-start", gap: 12, width: "100%", textAlign: "left", background: "none", border: "none", cursor: "pointer", padding: "2px 0" }
                    },
                      h(Avatar, { name: p.name, photo: p.photo, size: isOpen ? 76 : 36, ring: confirmed.length ? "#E0227A" : undefined }),
                      h("div", { style: { minWidth: 0, flex: 1, paddingTop: isOpen ? 4 : 6 } },
                        h("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
                          h("span", { style: { fontSize: 14 } }, p.name),
                          h(Icon, { name: isOpen ? "chevron-up" : "chevron-down", size: 13, style: { color: "#948C9E" } })
                        ),
                        isOpen && p.zitat && h("div", { style: { fontSize: 12, fontStyle: "italic", marginTop: 2, color: "#B8860B" } }, '"', p.zitat, '"')
                      )
                    ),
                    isOpen && h("div", { className: "fade-in", style: { paddingLeft: 88, paddingRight: 8, marginTop: 4 } },
                      p.notiz && h("div", { style: { fontSize: 12, marginBottom: 4, color: "#726B85" } }, p.notiz),
                      p.instagram && h("a", { href: p.instagram, target: "_blank", rel: "noopener noreferrer", style: { fontSize: 12, display: "inline-flex", alignItems: "center", gap: 4, marginBottom: 4, color: "#14ABE0" } }, h(Icon, { name: "arrow-right-circle", size: 11 }), "Instagram öffnen"),
                      confirmed.length > 0 && confirmed.map(c => h("div", { key: c.id, style: { fontSize: 12, display: "flex", alignItems: "center", gap: 4, marginBottom: 2, color: "#E0227A" } }, h(Icon, { name: "heart", size: 11, fill: "#E0227A" }), "Perfect Match: ", nameOf(c.aId === p.id ? c.bId : c.aId))),
                      excluded.length > 0 && h("div", { style: { fontSize: 12, color: "#C81E3A" } }, "Kein Match: ", excluded.map(e => nameOf(e.aId === p.id ? e.bId : e.aId)).join(", ")),
                      !p.notiz && confirmed.length === 0 && excluded.length === 0 && h("div", { style: { fontSize: 12, color: "#948C9E" } }, "Noch nichts bekannt")
                    )
                  );
                })
              ),
              state[key].length === 0 && h("p", { style: { fontSize: 12, color: "#948C9E" } }, "Noch niemand eingetragen.")
            );
          })
        )
      ),

      // Ersatzbank (nur falls belegt)
      state.bench.length > 0 && h("section", null,
        h(SectionLabel, { icon: "armchair" }, "Ersatzbank & Nachrücker"),
        h("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
          state.bench.map(p => h("div", { key: p.id, style: { display: "flex", alignItems: "center", gap: 12, padding: "8px 12px", borderRadius: 12, background: "#F7F5FC", border: "1px solid #E7E1F0" } },
            h(Avatar, { name: p.name, photo: p.photo, size: 32 }),
            h("div", { style: { flex: 1, minWidth: 0 } },
              h("div", { style: { fontSize: 14 } }, p.name),
              p.notiz && h("div", { style: { fontSize: 10, color: "#948C9E" } }, p.notiz)
            )
          ))
        )
      ),

      // Matching Nights
      h("section", null,
        h(SectionLabel, { icon: "lightbulb" }, "Matching Nights"),
        state.nights.length === 0
          ? h("p", { style: { fontSize: 12, color: "#948C9E" } }, "Noch keine Matching Night eingetragen.")
          : h("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
              state.nights.map(night => {
                const nA_ = state.groupA.length, nB_ = state.groupB.length;
                const smallKey = nA_ <= nB_ ? "groupA" : "groupB";
                const bigKey = smallKey === "groupA" ? "groupB" : "groupA";
                const smallArr = state[smallKey], bigArr = state[bigKey];
                const isOpen = expandedNight === night.id;
                return h("div", { key: night.id, style: { borderRadius: 12, overflow: "hidden", background: "#F7F5FC", border: "1px solid #E7E1F0" } },
                  h("div", {
                    onClick: () => setExpandedNight(isOpen ? null : night.id),
                    style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", cursor: "pointer" }
                  },
                    h("div", { style: { display: "flex", alignItems: "center", gap: 12 } },
                      h("span", { style: { fontSize: 14, fontWeight: 500 } }, night.label),
                      h("span", { className: "mono-font", style: { fontSize: 12, padding: "2px 8px", borderRadius: 999, background: "#E7E1F0", color: "#F2B705", display: "inline-flex", alignItems: "center", gap: 4 } }, h(Icon, { name: "lightbulb", size: 11 }), " ", night.lights, " Lichter")
                    ),
                    h(Icon, { name: isOpen ? "chevron-up" : "chevron-down", size: 14, style: { color: "#948C9E" } })
                  ),
                  isOpen && h("div", { className: "fade-in", style: { padding: "0 16px 12px", display: "flex", flexDirection: "column", gap: 4 } },
                    smallArr.map(s => {
                      // Sucht in beide Richtungen: manuell angelegte Abende (klein->groß
                      // gespeichert) genauso wie synchronisierte (immer Mann->Frau
                      // gespeichert, unabhängig davon welche Gruppe gerade kleiner ist).
                      // Nur in eine Richtung zu suchen zeigte bei manchen Staffeln
                      // fälschlich "—" für alle an.
                      const directPartner = night.pairs[s.id];
                      const reversePartner = directPartner ? null : Object.entries(night.pairs).find(([k, v]) => v === s.id)?.[0];
                      const partnerIds = [directPartner || reversePartner, night.extraPartner && night.extraPartner.smallId === s.id ? night.extraPartner.bigId : null].filter(Boolean);
                      const names = partnerIds.map(pid => (bigArr.find(x => x.id === pid) || {}).name).filter(Boolean);
                      return h("div", { key: s.id, style: { fontSize: 12, display: "flex", alignItems: "center", gap: 8, color: "#726B85" } },
                        h("span", null, s.name), h("span", { style: { color: "#948C9E" } }, "+"), h("span", null, names.length ? names.join(" & ") : "—")
                      );
                    })
                  )
                );
              })
            )
      ),

      // Doppel-Match-Twist (nur falls aktiv)
      (state.doubleMatchIds || []).length > 0 && h("section", null,
        h(SectionLabel, { icon: "heart" }, "Doppel-Match-Twist"),
        h("p", { style: { fontSize: 12, color: "#726B85" } }, "Aktiv für: ", state.doubleMatchIds.map(id => nameOf(id)).join(", "))
      ),

      // Matchbox
      h("section", null,
        h(SectionLabel, { icon: "lock" }, "Matchbox-Ergebnisse"),
        state.matchbox.length === 0
          ? h("p", { style: { fontSize: 12, color: "#948C9E" } }, "Noch keine Matchbox-Ergebnisse eingetragen.")
          : h("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
              state.matchbox.map(tb => {
                const a = [...state.groupA, ...state.groupB].find(p => p.id === tb.aId);
                const b = [...state.groupA, ...state.groupB].find(p => p.id === tb.bId);
                return h("div", { key: tb.id, style: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "10px 16px", borderRadius: 12, background: "#F7F5FC", border: "1px solid #E7E1F0" } },
                  h("div", { style: { minWidth: 0, flex: 1 } },
                    h("div", { style: { fontSize: 14 } }, (a && a.name) || "?", " + ", (b && b.name) || "?"),
                    tb.episode && h("div", { style: { fontSize: 10, color: "#948C9E" } }, "Folge ", tb.episode)
                  ),
                  tb.isMatch
                    ? h("span", { className: "heart-glow", style: { fontSize: 12, display: "flex", alignItems: "center", gap: 4, color: "#E0227A" } }, h(Icon, { name: "heart", size: 13, fill: "#E0227A" }), "Perfect Match")
                    : tb.verkauft
                      ? h("span", { style: { fontSize: 12, display: "flex", alignItems: "center", gap: 4, color: "#B8860B" } }, h(Icon, { name: "cloud-upload", size: 13 }), "Verkauft")
                      : h("span", { style: { fontSize: 12, display: "flex", alignItems: "center", gap: 4, color: "#C81E3A" } }, h(Icon, { name: "x", size: 13 }), "Kein Match")
                );
              })
            )
      ),

      // Vorausberechnung
      h("section", null,
        h(SectionLabel, {
          icon: "calculator",
          right: computing ? h("span", { style: { fontSize: 12, display: "flex", alignItems: "center", gap: 6, color: "#726B85" } }, h(Icon, { name: "refresh-cw", size: 12, className: "spin" }), " berechnet…") : null
        }, "Vorausberechnung"),
        result && result.error && h("p", { style: { fontSize: 14, padding: "12px 16px", borderRadius: 12, background: "rgba(200,30,58,0.1)", border: "1px solid rgba(200,30,58,0.35)", color: "#D6336C" } }, result.error),
        !result && ready && state.nights.length === 0 && state.matchbox.length === 0 && h("p", { style: { fontSize: 14, padding: "12px 16px", borderRadius: 12, background: "#F7F5FC", border: "1px solid #E7E1F0", color: "#726B85" } }, "Noch keine Matching Night oder Matchbox-Eintrag vorhanden."),
        result && !result.error && result.matrix.length === state.groupA.length && (result.matrix[0] || []).length === state.groupB.length && h("div", { className: "fade-in" },
          h("p", { style: { fontSize: 12, marginBottom: 12, color: "#726B85" } },
            h("span", { className: "mono-font", style: { color: "#F2B705" } }, result.solutionCount.toLocaleString("de-DE")),
            " mögliche Kombination", result.solutionCount === 1 ? "" : "en", " erfüllen alle eingetragenen Nächte & Matchbox-Ergebnisse.",
            result.doubleMatchActive && h("span", { style: { color: "#E0227A" } }, " Doppel-Match-Twist aktiv für ", (state.doubleMatchIds || []).map(id => nameOf(id)).join(", "), "."),
            result.solutionCount === 1 && h("span", { style: { color: "#E0227A" } }, " Eindeutige Lösung gefunden!"),
            result.solutionCount === 1 && uniqueSinceNight && h("span", { className: "block", style: { marginTop: 4, color: "#3F9142", fontWeight: 500 } }, "✓ Rechnerisch bereits eindeutig seit ", uniqueSinceNight, "."),
            result.solutionCount === 1 && uniqueSinceComputing && !uniqueSinceNight && h("span", { className: "block", style: { marginTop: 4, color: "#948C9E" } }, "Prüfe, seit welcher Nacht die Lösung eindeutig war …")
          ),
          h("div", { style: { overflowX: "auto", overflowY: "auto", maxHeight: "60vh", borderRadius: 12, border: "1px solid #E7E1F0" } },
            h("table", { style: { width: "100%", fontSize: 13, borderCollapse: "collapse" } },
              h("thead", null, h("tr", null,
                h("th", { style: { padding: 8, background: "#F7F5FC", position: "sticky", top: 0, left: 0, zIndex: 3 } }),
                state.groupB.map(b => h("th", { key: b.id, style: { padding: 8, textAlign: "center", fontWeight: 500, background: "#F7F5FC", color: "#584F6E", minWidth: 64, position: "sticky", top: 0, zIndex: 2 } },
                  h("div", { style: { display: "flex", flexDirection: "column", alignItems: "center", gap: 4 } },
                    h(Avatar, { name: b.name, photo: b.photo, size: 26 }),
                    h("span", { style: { maxWidth: 60, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, b.name)
                  )
                ))
              )),
              h("tbody", null, state.groupA.map((a, i) => h("tr", { key: a.id },
                h("td", { style: { padding: 8, background: "#F7F5FC", color: "#584F6E", position: "sticky", left: 0, zIndex: 1 } },
                  h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
                    h(Avatar, { name: a.name, photo: a.photo, size: 26 }),
                    h("span", { style: { maxWidth: 80, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, a.name)
                  )
                ),
                state.groupB.map((b, j) => {
                  const p = result.matrix[i][j];
                  const pct = Math.round(p * 100);
                  const isMax = p === maxProb && p > 0;
                  return h("td", { key: b.id, style: { padding: 4, textAlign: "center" } },
                    h("div", {
                      className: "mono-font",
                      style: {
                        borderRadius: 8, padding: "8px 0", fontWeight: 600,
                        background: p === 0 ? "#F1EEF7" : `rgba(224,34,122,${0.10 + p * 0.55})`,
                        color: p === 1 ? "#0E0A12" : p === 0 ? "#8A8298" : "#241D33",
                        border: isMax && p < 1 ? "1px solid #F2B705" : p === 1 ? "1px solid #E0227A" : "1px solid transparent"
                      }
                    }, p === 1 ? h(Icon, { name: "heart", size: 13, fill: "#0E0A12" }) : `${pct}%`)
                  );
                })
              )))
            )
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
